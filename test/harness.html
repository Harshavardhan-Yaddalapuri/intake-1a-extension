<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PERCEIVE Dev Harness</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; font-size: 13px; }
      .row { display: flex; gap: 8px; margin-bottom: 12px; }
      input[type="text"] { flex: 1; padding: 6px; }
      button { padding: 6px 12px; }
      pre { white-space: pre-wrap; word-break: break-all; background: #f5f5f5; padding: 10px; border-radius: 4px; max-height: 70vh; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>PERCEIVE Dev Harness</h1>
    <p>Loads the standalone PERCEIVE bundle against any URL via chrome.scripting and prints the Observation head.</p>
    <div class="row">
      <input type="text" id="target-url" placeholder="http://localhost:5173" />
      <button id="observe">Observe</button>
    </div>
    <pre id="output">Enter a URL and click Observe.</pre>
    <script src="test/harness.js"></script>
  </body>
</html>
